<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stazione Meteo MASI-PD</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --accent-color: #007aff;
            --border-color: #e5e5e5;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #f5f5f7;
                --text-muted: #a1a1a6;
                --accent-color: #0a84ff;
                --border-color: #333333;
                --shadow: 0 4px 12px rgba(0,0,0,0.3);
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 4px 0;
            font-weight: 700;
        }
        .station-id {
            font-size: 14px;
            color: var(--text-muted);
            background: var(--border-color);
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        .main-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            position: relative;
        }
        .temp-display {
            font-size: 64px;
            font-weight: 200;
            margin: 10px 0;
            line-height: 1;
        }
        .grid-sensors {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }
        .sensor-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .sensor-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .sensor-value {
            font-size: 18px;
            font-weight: 600;
        }
        .full-width {
            grid-column: span 2;
        }
        .footer-info {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 20px;
            line-height: 1.5;
        }
        .btn-refresh {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,122,255,0.3);
            width: 100%;
        }
        .error-msg {
            color: #ff453a;
            font-weight: bold;
            padding: 20px;
            text-align: center;
        }
        .section-title {
            grid-column: span 2;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 10px 0 2px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Stazione Meteo MASI-PD</h1>
        <span class="station-id">ID: IMASI7</span>
    </header>

    <div id="weather-content">
        <!-- Caricamento iniziale dei dati -->
        <div class="main-card">Caricamento dati in corso...</div>
    </div>

    <button class="btn-refresh" onclick="fetchWeather()">Aggiorna Dati</button>

    <div class="footer-info">
        Aggiornamento automatico ogni 5 minuti.<br>
        Dati estratti in tempo reale dalle API di WeatherUnderground.
    </div>
</div>

<script>
    const stationId = 'IMASI7';
    const apiKey = '6240e69b30c8456280e69b30c8156279';
    const url = `https://weather.com{stationId}&format=json&units=m&apiKey=${apiKey}`;

    function degToCompass(num) {
        var val = Math.floor((num / 22.5) + 0.5);
        var arr = ["N", "N-NE", "NE", "E-NE", "E", "E-SE", "SE", "S-SE", "S", "S-SO", "SO", "O-SO", "O", "O-NO", "NO", "N-NO"];
        return arr[(val % 16)];
    }

    // Gestione dei valori assenti o non trasmessi dalla centralina
    function formatValue(value, unit, decimals = 1) {
        if (value === null || value === undefined || isNaN(value)) {
            return `<span style="color:var(--text-muted); font-weight:normal;">--</span>`;
        }
        return `${Number(value).toFixed(decimals)} ${unit}`;
    }

    async function fetchWeather() {
        const contentDiv = document.getElementById('weather-content');
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Errore nel recupero dati');
            const data = await response.json();
            
            if (!data.observations || data.observations.length === 0) {
                throw new Error('Nessun dato disponibile');
            }

            const obs = data.observations[0];
            const metric = obs.metric;

            // Formattazione data locale italiana
            const obsTime = new Date(obs.obsTimeLocal).toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});

            contentDiv.innerHTML = `
                <!-- Blocco Principale Temperatura -->
                <div class="main-card">
                    <div class="sensor-label">Temperatura Esterna</div>
                    <div class="temp-display">${formatValue(metric.temp, '°C', 1)}</div>
                    <div class="sensor-value" style="font-size:14px; color:var(--text-muted);">
                        Umidità: ${formatValue(obs.humidity, '%', 0)}
                    </div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:15px;">
                        Ultimo report della centralina: <b>${obsTime}</b>
                    </div>
                </div>

                <!-- Griglia Completa di tutti i Sensori Possibili -->
                <div class="grid-sensors">
                    
                    <!-- SEZIONE VENTO -->
                    <div class="section-title">Vento</div>
                    <div class="sensor-card">
                        <div class="sensor-label">Velocità Vento</div>
                        <div class="sensor-value">${formatValue(metric.windSpeed, 'km/h', 1)}</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Raffica Massima</div>
                        <div class="sensor-value">${formatValue(metric.windGust, 'km/h', 1)}</div>
                    </div>
                    <div class="sensor-card full-width">
                        <div class="sensor-label">Direzione Vento</div>
                        <div class="sensor-value">
                            ${obs.winddir !== null ? `${obs.winddir}° (${degToCompass(obs.winddir)})` : '--'}
                        </div>
                    </div>

                    <!-- SEZIONE PRECIPITAZIONI -->
                    <div class="section-title">Pioggia</div>
                    <div class="sensor-card">
                        <div class="sensor-label">Intensità Oraria</div>
                        <div class="sensor-value">${formatValue(metric.precipRate, 'mm/h', 1)}</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Accumulo Odierno</div>
                        <div class="sensor-value">${formatValue(metric.precipTotal, 'mm', 1)}</div>
                    </div>

                    <!-- SEZIONE PRESSIONE E INDICI TERMICI -->
                    <div class="section-title">Atmosfera e Indici</div>
                    <div class="sensor-card">
                        <div class="sensor-label">Pressione Barometrica</div>
                        <div class="sensor-value">${formatValue(metric.pressure, 'hPa', 1)}</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Punto di Rugiada</div>
                        <div class="sensor-value">${formatValue(metric.dewpt, '°C', 1)}</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Percepita (Wind Chill)</div>
                        <div class="sensor-value">${formatValue(metric.windChill, '°C', 1)}</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Indice di Calore</div>
                        <div class="sensor-value">${formatValue(metric.heatIndex, '°C', 1)}</div>
                    </div>

                    <!-- SEZIONE RADIAZIONE SOLARE / UV -->
                    <div class="section-title">Radiazione e Luce</div>
                    <div class="sensor-card">
                        <div class="sensor-label">Indice UV</div>
