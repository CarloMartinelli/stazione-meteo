<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stazione Meteo MASI-PD</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0073e6;
            --muted-text: #666666;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --accent-color: #4da3ff;
                --muted-text: #aaaaaa;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; color: var(--accent-color); }
        .station-id { font-size: 0.9rem; color: var(--muted-text); font-weight: bold; }
        .last-update { font-size: 0.8rem; color: var(--muted-text); margin-top: 5px; }
        .error {
            background-color: #ffdde0;
            color: #d32f2f;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-size: 0.9rem;
        }
        .main-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .temp-display { font-size: 3.5rem; font-weight: bold; margin: 10px 0; line-height: 1; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-label { font-size: 0.8rem; color: var(--muted-text); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-value { font-size: 1.2rem; font-weight: bold; }
        .btn-refresh {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-refresh:active { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Stazione Meteo MASI-PD</h1>
        <div class="station-id">ID Stazione: IMASI7</div>
        <div class="last-update" id="time">-</div>
    </header>

    <div id="error-msg" class="error">Impossibile recuperare i dati. Verifica la connessione o le credenziali.</div>

    <div class="main-card">
        <div class="card-label">Temperatura</div>
        <div class="temp-display" id="temp">--°C</div>
        <div style="font-size: 0.9rem; color: var(--muted-text);" id="condition">Percepita: --°C</div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-label">Umidità</div>
            <div class="card-value" id="humidity">--%</div>
        </div>
        <div class="card">
            <div class="card-label">Vento</div>
            <div class="card-value" id="wind">-- km/h</div>
        </div>
        <div class="card">
            <div class="card-label">Pioggia Odierna</div>
            <div class="card-value" id="precip">-- mm</div>
        </div>
        <div class="card">
            <div class="card-label">Pressione</div>
            <div class="card-value" id="pressure">-- hPa</div>
        </div>
        <div class="card">
            <div class="card-label">Radiazione UV</div>
            <div class="card-value" id="uv">--</div>
        </div>
        <div class="card">
            <div class="card-label">Punto di Rugiada</div>
            <div class="card-value" id="dewpoint">--°C</div>
        </div>
    </div>

    <button class="btn-refresh" onclick="fetchWeatherData()">Aggiorna Dati</button>
</div>

<script>
    const apiKey = '6240e69b30c8456280e69b30c8156279';
    const stationId = 'IMASI7';
    const url = `https://api.weather.com/v2/pws/observations/current?stationId=${stationId}&format=json&units=m&apiKey=${apiKey}`;

    async function fetchWeatherData() {
        const errorDiv = document.getElementById('error-msg');
        try {
            errorDiv.style.display = 'none';
            const response = await fetch(url);
            if (!response.ok) throw new Error('Errore di rete o API invalida');
            
            const data = await response.json();
            const obs = data.observations[0];

            // Aggiornamento DOM con metriche Europee (Celsius, km/h, mm, hPa)
            document.getElementById('temp').innerText = `${obs.metric.temp}°C`;
            document.getElementById('condition').innerText = `Percepita: ${obs.metric.windChill}°C`;
            document.getElementById('humidity').innerText = `${obs.humidity}%`;
            document.getElementById('wind').innerText = `${obs.metric.windSpeed} km/h (${getWindDirection(obs.winddir)})`;
            document.getElementById('precip').innerText = `${obs.metric.precipTotal} mm`;
            document.getElementById('pressure').innerText = `${obs.metric.pressure} hPa`;
            document.getElementById('uv').innerText = obs.uv !== null ? obs.uv : '0';
            document.getElementById('dewpoint').innerText = `${obs.metric.dewpt}°C`;
            
            // Gestione orario locale
            const localTime = new Date(obs.obsTimeLocal);
            document.getElementById('time').innerText = `Ultimo aggiornamento: ${localTime.toLocaleTimeString('it-IT')} del ${localTime.toLocaleDateString('it-IT')}`;
            
        } catch (error) {
            console.error(error);
            errorDiv.style.display = 'block';
        }
    }

    function getWindDirection(deg) {
        if (deg >= 337.5 || deg < 22.5) return 'N';
        if (deg >= 22.5 && deg < 67.5) return 'NE';
        if (deg >= 67.5 && deg < 112.5) return 'E';
        if (deg >= 112.5 && deg < 157.5) return 'SE';
        if (deg >= 157.5 && deg < 202.5) return 'S';
        if (deg >= 202.5 && deg < 247.5) return 'SO';
        if (deg >= 247.5 && deg < 292.5) return 'O';
        if (deg >= 292.5 && deg < 337.5) return 'NO';
        return '';
    }

    // Carica i dati all'apertura
    fetchWeatherData();
    // Aggiorna automaticamente ogni 5 minuti
    setInterval(fetchWeatherData, 300000);
</script>

</body>
</html>
