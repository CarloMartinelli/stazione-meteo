<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stazione Meteo MASI-PD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f7;
            color: #2b2b2b;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #1b2a47;
            color: #ffffff;
            padding: 15px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #b0c4de;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dcdcdc;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
        }
        .main-panel {
            padding: 20px 15px;
            text-align: center;
        }
        .time {
            font-size: 12px;
            color: #666666;
            margin-bottom: 10px;
        }
        .temp {
            font-size: 56px;
            font-weight: bold;
        }
        .unit {
            font-size: 28px;
            vertical-align: super;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            border-top: 1px solid #dcdcdc;
        }
        .grid-item {
            padding: 15px;
            border-bottom: 1px solid #dcdcdc;
            box-sizing: border-box;
        }
        .grid-item:nth-child(odd) {
            border-right: 1px solid #dcdcdc;
        }
        .label {
            font-size: 12px;
            color: #666666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .value {
            font-size: 16px;
            font-weight: bold;
        }
        .full-row {
            grid-column: span 2;
        }
        .btn {
            background-color: #00739c;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
        }
        .error {
            padding: 30px 15px;
            text-align: center;
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Stazione Meteo MASI-PD</h1>
    <p>ID Stazione: IMASI7</p>
</div>

<div class="container">
    <div id="meteo-dashboard">
        <div class="card">
            <div class="main-panel">
                <div class="time">Connessione in corso...</div>
            </div>
        </div>
    </div>
    <button class="btn" onclick="caricaMeteo()">Aggiorna Dati</button>
</div>

<script>
    function bussa(gradi) {
        if (gradi === null || gradi === undefined || isNaN(gradi)) return '--';
        var idx = Math.floor((gradi / 22.5) + 0.5) % 16;
        var bus = ["N", "N-NE", "NE", "E-NE", "E", "E-SE", "SE", "S-SE", "S", "S-SO", "SO", "O-SO", "O", "O-NO", "NO", "N-NO"];
        return bus[idx];
    }

    function txt(val, u, d) {
        if (val === null || val === undefined || isNaN(val) || val === "") return '--';
        return Number(val).toFixed(d) + ' ' + u;
    }

    function caricaMeteo() {
        var box = document.getElementById('meteo-dashboard');
        var api = 'https://weather.com';

        fetch(api)
            .then(function(r) { return r.json(); })
            .then(function(j) {
                if (!j.observations || j.observations.length === 0) {
                    box.innerHTML = '<div class="card"><div class="error">Nessun dato trovato</div></div>';
                    return;
                }
                var o = j.observations[0];
                var m = o.metric;
                var t = new Date(o.obsTimeLocal).toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});

                box.innerHTML = '<div class="card">' +
                    '<div class="card-header">Condizioni Attuali</div>' +
                    '<div class="main-panel">' +
                        '<div class="time">Ultimo aggiornamento: <b>' + t + '</b></div>' +
                        '<div class="temp">' + Number(m.temp).toFixed(1) + '<span class="unit">°C</span></div>' +
                    '</div>' +
                    '<div class="grid">' +
                        '<div class="grid-item"><div class="label">Umidità</div><div class="value">' + txt(o.humidity, '%', 0) + '</div></div>' +
                        '<div class="grid-item"><div class="label">Pressione</div><div class="value">' + txt(m.pressure, 'hPa', 1) + '</div></div>' +
                        '<div class="grid-item"><div class="label">Punto di Rugiada</div><div class="value">' + txt(m.dewpt, '°C', 1) + '</div></div>' +
                        '<div class="grid-item"><div class="label">Percepita (Heat Index)</div><div class="value">' + txt(m.heatIndex, '°C', 1) + '</div></div>' +
                    '</div>' +
                '</div>' +
                '<div class="card">' +
                    '<div class="card-header">Vento e Pioggia</div>' +
                    '<div class="grid">' +
                        '<div class="grid-item"><div class="label">Velocità Vento</div><div class="value">' + txt(m.windSpeed, 'km/h', 1) + '</div></div>' +
                        '<div class="grid-item"><div class="label">Raffiche</div><div class="value">' + txt(m.windGust, 'km/h', 1) + '</div></div>' +
                        '<div class="grid-item full-row"><div class="label">Direzione Vento</div><div class="value">' + (o.winddir !== null && o.winddir !== undefined ? o.winddir + '° (' + bussa(o.winddir) + ')' : '--') + '</div></div>' +
                        '<div class="grid-item"><div class="label">Pioggia Oraria</div><div class="value">' + txt(m.precipRate, 'mm/h', 1) + '</div></div>' +
                        '<div class="grid-item"><div class="label">Pioggia Oggi</div><div class="value">' + txt(m.precipTotal, 'mm', 1) + '</div></div>' +
                    '</div>' +
                '</div>' +
                '<div class="card">' +
                    '<div class="card-header">Radiazione e Luce</div>' +
                    '<div class="grid">' +
                        '<div class="grid-item"><div class="label">Indice UV</div><div class="value">' + txt(o.uv, '', 1) + '</div></div>' +
                        '<div class="grid-item"><div class="label">Radiazione Solare</div><div class="value">' + txt(o.solarRadiation, 'W/m²', 0) + '</div></div>' +
                    '</div>' +
                '</div>';
            })
            .catch(function(e) {
                box.innerHTML = '<div class="card"><div class="error">⚠️ Errore di caricamento dati</div></div>';
            });
    }

    caricaMeteo();
    setInterval(caricaMeteo, 300000);
</script>

</body>
</html>
